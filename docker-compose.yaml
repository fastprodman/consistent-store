services:
  postgres:
    image: postgres:16-alpine
    container_name: transactional-outbox-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: outbox_demo
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d outbox_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-1:
    image: apache/kafka:3.8.0
    container_name: transactional-outbox-kafka-1
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id "$$KAFKA_CLUSTER_ID" --config /opt/kafka/config/kraft/server.properties
        /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
    environment:
      KAFKA_CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - ./kafka/kafka-1.properties:/opt/kafka/config/kraft/server.properties:ro
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-2:
    image: apache/kafka:3.8.0
    container_name: transactional-outbox-kafka-2
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id "$$KAFKA_CLUSTER_ID" --config /opt/kafka/config/kraft/server.properties
        /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
    environment:
      KAFKA_CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - ./kafka/kafka-2.properties:/opt/kafka/config/kraft/server.properties:ro
    ports:
      - "19093:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-3:
    image: apache/kafka:3.8.0
    container_name: transactional-outbox-kafka-3
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id "$$KAFKA_CLUSTER_ID" --config /opt/kafka/config/kraft/server.properties
        /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
    environment:
      KAFKA_CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - ./kafka/kafka-3.properties:/opt/kafka/config/kraft/server.properties:ro
    ports:
      - "19094:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-topic-init:
    image: apache/kafka:3.8.0
    container_name: transactional-outbox-kafka-topic-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --create --if-not-exists --topic order.events \
          --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --create --if-not-exists --topic customer.events \
          --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2
    restart: "no"

  kafka-connect:
    image: quay.io/debezium/connect:2.7
    container_name: transactional-outbox-connect
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: transactional-outbox-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: transactional-outbox-kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-connect:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8081:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: transactional-outbox-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: transactional-outbox-otel-collector
    depends_on:
      jaeger:
        condition: service_started
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  order-service:
    build:
      context: .
      dockerfile: cmd/order-service/Dockerfile
    container_name: transactional-outbox-order-service
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/outbox_demo?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "8080:8080"

  analytics-consumer:
    build:
      context: .
      dockerfile: cmd/analytics-consumer/Dockerfile
    container_name: transactional-outbox-analytics-consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/outbox_demo?sslmode=disable
      KAFKA_BROKER: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  notification-service:
    build:
      context: .
      dockerfile: cmd/notification-service/Dockerfile
    container_name: transactional-outbox-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/outbox_demo?sslmode=disable
      KAFKA_BROKER: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  debezium-init:
    image: curlimages/curl:8.10.1
    container_name: transactional-outbox-debezium-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./debezium/postgres-outbox-connector.json:/connector.json:ro
    command:
      - sh
      - -c
      - |
        echo "Registering Debezium connector..."

        curl -fsS -X PUT http://kafka-connect:8083/connectors/postgres-outbox-connector/config \
          -H "Content-Type: application/json" \
          --data @/connector.json

        echo "Debezium connector registered."
    restart: "no"

volumes:
  postgres_data:
